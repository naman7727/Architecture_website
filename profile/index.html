<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shop Profile Form — Rohit Khandelwal</title>
<style>
  :root{
    --bg:#fafafa;
    --text:#262626;
    --accent:#0095f6;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);padding:20px}

  header{border-bottom:1px solid #dbdbdb;background:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
  header .logo{font-family:'Billabong',cursive;font-size:28px;color:var(--text)}

  .form-container{max-width:800px;margin:40px auto;background:#fff;padding:24px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
  h2{margin-bottom:20px;font-size:22px}
  form{display:grid;gap:16px}
  label{font-size:14px;font-weight:600;margin-bottom:4px;display:block}
  input,textarea,select{width:100%;padding:10px;border:1px solid #dbdbdb;border-radius:6px;font-size:14px}
  textarea{resize:vertical;min-height:80px}
  button{background:var(--accent);color:#fff;border:none;padding:10px 16px;border-radius:6px;font-weight:600;cursor:pointer;transition:.2s}
  button:hover{opacity:0.9}

  .form-group{display:flex;flex-direction:column}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}

  .payment-options{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
  .payment-options label{font-weight:normal;font-size:14px;display:flex;align-items:center;gap:6px}

  @media(max-width:600px){
    .form-row{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<header>
  <div class="logo">Shop Profile</div>
</header>

<div class="form-container">
  <h2>Create Shop Profile</h2>
  <form id="shopForm">
    <div class="form-group">
      <label for="shopName">Shop Name</label>
      <input type="text" id="shopName" name="shopName" placeholder="Enter shop name" required>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="ownerName">Owner Name</label>
        <input type="text" id="ownerName" name="ownerName" placeholder="Enter owner name" required>
      </div>
      <div class="form-group">
        <label for="contact">Contact Number</label>
        <input type="tel" id="contact" name="contact" placeholder="Enter phone number" required>
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter email address">
    </div>

    <div class="form-group">
      <label for="shopType">Shop Category</label>
      <select id="shopType" name="shopType">
        <option value="">Select category</option>
        <option value="grocery">Grocery</option>
        <option value="clothing">Clothing</option>
        <option value="electronics">Electronics</option>
        <option value="restaurant">Restaurant</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div class="form-group">
      <label for="address">Shop Address</label>
      <textarea id="address" name="address" placeholder="Enter full shop address"></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="city">City</label>
        <input type="text" id="city" name="city" placeholder="Enter city">
      </div>
      <div class="form-group">
        <label for="pincode">Pincode</label>
        <input type="text" id="pincode" name="pincode" placeholder="Enter pincode">
      </div>
    </div>

    <div class="form-group">
      <label for="description">Shop Description</label>
      <textarea id="description" name="description" placeholder="Tell something about your shop"></textarea>
    </div>

    <div class="form-group">
      <label>Payment Methods Accepted</label>
      <div class="payment-options">
        <label><input type="checkbox" name="payment[]" value="Cash"> Cash</label>
        <label><input type="checkbox" name="payment[]" value="Card"> Credit/Debit Card</label>
        <label><input type="checkbox" name="payment[]" value="UPI"> UPI</label>
        <label><input type="checkbox" name="payment[]" value="Net Banking"> Net Banking</label>
        <label><input type="checkbox" name="payment[]" value="Wallets"> Digital Wallets</label>
      </div>
    </div>

    <div class="form-group">
      <label for="profilePic">Shop Profile Picture</label>
      <input type="file" id="profilePic" accept="image/*">
    </div>

    <button type="submit">Save Profile</button>
  </form>
</div>

<script>
const form = document.getElementById('shopForm');
const savedData = JSON.parse(localStorage.getItem('shopProfile') || '{}');

// Pre-fill form if data exists
if(savedData.shopName) form.shopName.value = savedData.shopName;
if(savedData.ownerName) form.ownerName.value = savedData.ownerName;
if(savedData.contact) form.contact.value = savedData.contact;
if(savedData.email) form.email.value = savedData.email;
if(savedData.shopType) form.shopType.value = savedData.shopType;
if(savedData.address) form.address.value = savedData.address;
if(savedData.city) form.city.value = savedData.city;
if(savedData.pincode) form.pincode.value = savedData.pincode;
if(savedData.description) form.description.value = savedData.description;
if(savedData.payment){
  savedData.payment.forEach(p=>{
    const checkbox = document.querySelector(`input[name="payment[]"][value="${p}"]`);
    if(checkbox) checkbox.checked = true;
  });
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const formData = {
    shopName: form.shopName.value,
    ownerName: form.ownerName.value,
    contact: form.contact.value,
    email: form.email.value,
    shopType: form.shopType.value,
    address: form.address.value,
    city: form.city.value,
    pincode: form.pincode.value,
    description: form.description.value,
    payment: Array.from(document.querySelectorAll('input[name="payment[]"]:checked')).map(el => el.value),
  };

  const profilePicInput = document.getElementById('profilePic');
  if(profilePicInput.files[0]){
    const reader = new FileReader();
    reader.onload = function(e){
      formData.profilePic = e.target.result;
      localStorage.setItem('shopProfile', JSON.stringify(formData));
      window.location.href = 'dashboard.html';
    }
    reader.readAsDataURL(profilePicInput.files[0]);
  } else {
    localStorage.setItem('shopProfile', JSON.stringify(formData));
    window.location.href = 'dashboard.html';
  }
});
</script>
</body>
</html>
