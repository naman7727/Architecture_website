     <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Address & Pincode Search</title>
  <link rel="stylesheet" href="style.css">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
     
</head>
<body>

  <h2>Search Address / Pincode</h2>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Enter address or pin code..." onkeyup="searchCard()">
  </div>

  <div class="card-container" id="cardContainer">
    <div class="card">
      <div class="address">MG Road, Delhi</div>
      <div class="details">Near Metro Station, Pin: 110001</div>
    </div>
    <div class="card">
      <div class="address">Sector 15, Noida</div>
      <div class="details">Near Mall, Pin: 201301</div>
    </div>
    <div class="card">
      <div class="address">Bandra West, Mumbai</div>
      <div class="details">Near Sea Link, Pin: 400050</div>
    </div>
    <div class="card">
      <div class="address">Indiranagar, Bangalore</div>
      <div class="details">Near 100ft Road, Pin: 560038</div>
    </div>
    <div class="card">
      <div class="address">Anna Nagar, Chennai</div>
      <div class="details">Near Tower Park, Pin: 600040</div>
    </div>
  </div>

<script type="text/javascript" src="app.js" defer></script>
</body>
</html>
